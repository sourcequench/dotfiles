# Shared interactive choices from slappy, with current tmux syntax.
set -g allow-passthrough on
set -s escape-time 0
set -g focus-events on
set-option -g default-shell /bin/bash
set -g update-environment "SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION DISPLAY WAYLAND_DISPLAY"
set-option -g history-limit 50000
setw -g mode-keys vi

set -g status on
set -g status-interval 3
set -g status-style 'bg=colour235 fg=colour250'
set -g status-left-length 30
set -g status-right-length 160
set -g status-left '#[fg=colour200,bold] #S #[fg=colour238]│ #[default]'
set -g status-right '#(~/.local/bin/personal-tmux-status "#{pane_current_path}" "#{pane_pid}" "#{window_panes}") '
set -g window-status-format ''
set -g window-status-current-format '#[fg=colour241,italics]#(~/.local/bin/personal-tmux-fortune)'
set -g status-justify centre

set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour200'
set -g pane-border-status top
set -g pane-border-format '#(~/.local/bin/personal-tmux-pane "#{pane_pid}" "#{pane_current_command}" "#{pane_active}")'

unbind C-b
set -g prefix C-a
bind a send-prefix
unbind %
bind | split-window -h
bind _ split-window -v

bind m set -g mouse on \; display 'Mouse: ON'
bind M set -g mouse off \; display 'Mouse: OFF'
set -g mouse on

unbind +
bind + new-window -d -n tmux-zoom 'clear && echo TMUX ZOOM && read' \; swap-pane -s tmux-zoom.0 \; select-window -t tmux-zoom
unbind -
bind - last-window \; swap-pane -s tmux-zoom.0 \; kill-window -t tmux-zoom
unbind p
bind p paste-buffer

setw -g automatic-rename off
set -g set-titles off
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-kitty:strikethrough,xterm-kitty:focus"
set -g set-clipboard off
bind-key -T root MouseDown2Pane run 'if [ -n "$WAYLAND_DISPLAY" ]; then wl-paste -p 2>/dev/null; else xclip -o -selection primary 2>/dev/null; fi | tmux load-buffer - && tmux paste-buffer'
unbind -T root MouseDrag1Pane
unbind -T root DoubleClick1Pane
unbind -T root TripleClick1Pane
bind-key -T root WheelUpPane copy-mode -e \; send-keys -M
bind-key -T root WheelDownPane send-keys -M
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind Space select-layout tiled

# Optional per-host and work-specific additions.
if-shell '[ -r "$HOME/.config/personal-dotfiles/work.conf" ]' 'source-file ~/.config/personal-dotfiles/work.conf'
if-shell '[ -r "$HOME/.config/personal-dotfiles/local.conf" ]' 'source-file ~/.config/personal-dotfiles/local.conf'

