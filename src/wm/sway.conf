# Generated Sway entry point.
include ~/.config/personal-dotfiles/shared.conf
set $mod Mod1
exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP SWAYSOCK && dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user restart xdg-desktop-portal xdg-desktop-portal-wlr && waybar
exec dunst
exec swayosd-server
exec nm-applet
exec blueman-applet
exec ~/.local/bin/personal-idle start
input type:keyboard xkb_options "altwin:ctrl_win"
focus_follows_mouse always
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart
bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit Sway?' -B 'Yes' 'swaymsg exit'
bindsym $mod+Insert exec ~/.local/bin/personal-touchpad-toggle
bindsym $mod+grave exec /usr/bin/dunstctl history-pop
bindsym $mod+Shift+grave exec /usr/bin/dunstctl close-all

exec swaymsg 'workspace 1; exec kitty'
exec sh -c 'command -v google-chrome >/dev/null 2>&1 && swaymsg "workspace 2; exec google-chrome"'
exec swaymsg 'workspace 3; exec ~/.local/bin/personal-helium'
exec swaymsg 'workspace 4; exec ~/.local/bin/personal-signal'



for_window [app_id="personal-tui"] floating enable, resize set width 1000 px height 650 px, move position center
