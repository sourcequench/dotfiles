# Generated i3 entry point.
include ~/.config/personal-dotfiles/shared.conf
set $mod Mod1
tiling_drag modifier titlebar
exec --no-startup-id dex --autostart --environment i3
exec_always --no-startup-id picom
exec --no-startup-id xss-lock --transfer-sleep-lock -- personal-lock
exec --no-startup-id dunst
exec --no-startup-id nm-applet
exec --no-startup-id blueman-applet
exec_always --no-startup-id xmodmap ~/.Xmodmap
exec --no-startup-id inputplug -d -c ~/.local/bin/personal-keyboard-remap

bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart
bindsym $mod+Shift+e exec i3-nagbar -t warning -m 'Exit i3?' -B 'Yes' 'i3-msg exit'
bindsym $mod+Insert exec personal-touchpad-toggle

exec --no-startup-id i3-msg 'workspace 1; exec kitty'
exec --no-startup-id sh -c 'command -v google-chrome >/dev/null 2>&1 && i3-msg "workspace 2; exec google-chrome"'
exec --no-startup-id i3-msg 'workspace 3; exec ~/.local/bin/personal-helium'
exec --no-startup-id i3-msg 'workspace 4; exec ~/.local/bin/personal-signal'

bar {
    status_command ~/.local/bin/personal-status
}

