# Generated i3 entry point.
include ~/.config/personal-dotfiles/shared.conf
tiling_drag modifier titlebar
exec --no-startup-id dex --autostart --environment i3
exec_always --no-startup-id picom
exec --no-startup-id xss-lock --transfer-sleep-lock -- i3lock
exec --no-startup-id dunst
exec --no-startup-id setxkbmap -option altwin:ctrl_win
exec --no-startup-id xmodmap ~/.Xmodmap
exec --no-startup-id inputplug -d -c ~/.local/bin/personal-keyboard-remap

bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart
bindsym $mod+Shift+e exec i3-nagbar -t warning -m 'Exit i3?' -B 'Yes' 'i3-msg exit'

bar {
    status_command ~/.local/bin/personal-status
}

