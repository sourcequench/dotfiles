# Use the system monospace font so the config does not depend on a local font install.
clipboard_control write-clipboard write-primary read-clipboard read-primary
mouse_map middle press grabbed no_op
# Preserve the Unix primary selection workflow: highlight to copy, middle-click to paste.
mouse_map middle release ungrabbed paste_from_selection
mouse_map middle release grabbed paste_from_selection
mouse_map left press grabbed mouse_selection normal

